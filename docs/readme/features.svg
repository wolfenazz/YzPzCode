<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="t d">
  <title id="t">Everything in one window</title>
  <desc id="d">A grid of the main areas of YzPzCode: terminal grid, browser inspector, extensions, studios, device window, narration and run and build.</desc>
  <defs>
    <pattern id="px" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="3" y="3" width="12" height="12" rx="2.5" fill="#fff" opacity="0.03"/></pattern>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4285F4"/><stop offset="0.55" stop-color="#9B72CB"/><stop offset="1" stop-color="#D96570"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#F26B3A"/></linearGradient>
    <clipPath id="card"><rect width="1600" height="880" rx="28"/></clipPath>
  </defs>
  <style>
    .tag{font:700 13px 'SF Mono','JetBrains Mono',Consolas,Menlo,monospace;letter-spacing:2.5px}
    .h{font:700 28px Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F4F5F7;letter-spacing:-0.5px}
    .p{font:400 15.5px Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8A929E}
    .m{font:500 12px 'SF Mono',Consolas,Menlo,monospace;fill:#C9CED6}
    .t{fill:#12151A;stroke:#232830}
  </style>
  <g clip-path="url(#card)">
    <rect width="1600" height="880" fill="#0B0D10"/>
    <rect width="1600" height="880" fill="url(#px)"/>

    <!-- A: terminal grid -->
    <rect class="t" x="40" y="40" width="740" height="400" rx="20"/>
    <text class="tag" x="72" y="86" fill="#F26B3A">01 · TERMINAL GRID</text>
    <text class="h" x="72" y="128">Every agent, side by side.</text>
    <text class="p" x="72" y="158">Real PTY sessions per workspace. Claude, Codex, Gemini and</text>
    <text class="p" x="72" y="180">20+ more CLIs, with activity rings that show who is working.</text>
    <g transform="translate(72 212)">
      <rect width="210" height="196" rx="10" fill="#0B0D10" stroke="url(#gem)" stroke-width="2"/>
      <rect width="210" height="28" rx="10" fill="#171B21"/><rect y="16" width="210" height="12" fill="#171B21"/>
      <circle cx="14" cy="14" r="4" fill="#F26B3A"/><text class="m" x="26" y="18">claude</text>
      <g fill="#2A303A"><rect x="14" y="46" width="130" height="6" rx="3"/><rect x="14" y="62" width="170" height="6" rx="3"/><rect x="14" y="78" width="110" height="6" rx="3"/></g>
      <rect x="14" y="104" width="70" height="6" rx="3" fill="#3B82F6"/>
    </g>
    <g transform="translate(298 212)">
      <rect width="210" height="196" rx="10" fill="#0B0D10" stroke="#34D399" stroke-width="2"/>
      <rect width="210" height="28" rx="10" fill="#171B21"/><rect y="16" width="210" height="12" fill="#171B21"/>
      <circle cx="14" cy="14" r="4" fill="#3B82F6"/><text class="m" x="26" y="18">codex</text>
      <g fill="#2A303A"><rect x="14" y="46" width="150" height="6" rx="3"/><rect x="14" y="62" width="100" height="6" rx="3"/></g>
      <rect x="14" y="92" width="92" height="26" rx="13" fill="#34D399" opacity="0.15"/><path d="M26 105l5 5 9-10" fill="none" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="48" y="109" fill="#34D399" style="fill:#34D399">done</text>
    </g>
    <g transform="translate(524 212)">
      <rect width="228" height="196" rx="10" fill="#0B0D10" stroke="#232830"/>
      <rect width="228" height="28" rx="10" fill="#171B21"/><rect y="16" width="228" height="12" fill="#171B21"/>
      <circle cx="14" cy="14" r="4" fill="#9B72CB"/><text class="m" x="26" y="18">zsh · run ▸ build</text>
      <g fill="#2A303A"><rect x="14" y="46" width="170" height="6" rx="3"/><rect x="14" y="62" width="120" height="6" rx="3"/><rect x="14" y="78" width="190" height="6" rx="3"/><rect x="14" y="94" width="90" height="6" rx="3"/></g>
      <rect x="14" y="150" width="200" height="26" rx="13" fill="#171B21" stroke="#2A303A"/>
    </g>

    <!-- B: browser inspector -->
    <rect class="t" x="800" y="40" width="380" height="400" rx="20"/>
    <text class="tag" x="832" y="86" fill="#3B82F6">02 · BROWSER</text>
    <text class="h" x="832" y="128">Point, then prompt.</text>
    <text class="p" x="832" y="158">Pick any element and send it to an</text>
    <text class="p" x="832" y="180">agent with one line.</text>
    <g transform="translate(832 212)">
      <rect width="316" height="196" rx="10" fill="#0B0D10" stroke="#232830"/>
      <rect width="316" height="28" rx="10" fill="#171B21"/><rect y="16" width="316" height="12" fill="#171B21"/>
      <rect x="40" y="7" width="150" height="14" rx="7" fill="#0B0D10"/>
      <rect x="18" y="46" width="170" height="14" rx="4" fill="#2A303A"/>
      <rect x="18" y="70" width="110" height="60" rx="6" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5 4"/>
      <g transform="translate(96 108)">
        <rect width="204" height="72" rx="12" fill="#F4F5F7"/>
        <rect x="14" y="14" width="86" height="14" rx="7" fill="#C9CED6"/>
        <rect x="14" y="40" width="130" height="18" rx="9" fill="#E7E9ED"/>
        <rect x="152" y="40" width="40" height="18" rx="9" fill="#0B0D10"/>
      </g>
    </g>

    <!-- C: extensions -->
    <rect class="t" x="1200" y="40" width="360" height="400" rx="20"/>
    <text class="tag" x="1232" y="86" fill="#9B72CB">03 · EXTENSIONS</text>
    <text class="h" x="1232" y="128">Assistants as panels.</text>
    <text class="p" x="1232" y="158">VSCodium runtime, sandboxed per</text>
    <text class="p" x="1232" y="180">panel. Dock to the editor side.</text>
    <g transform="translate(1232 212)">
      <rect width="296" height="196" rx="10" fill="#0B0D10" stroke="#232830"/>
      <rect width="296" height="28" rx="10" fill="#171B21"/><rect y="16" width="296" height="12" fill="#171B21"/>
      <circle cx="14" cy="14" r="4" fill="#9B72CB"/><text class="m" x="26" y="18">Cline</text>
      <rect x="14" y="44" width="170" height="34" rx="9" fill="#171B21"/>
      <rect x="112" y="88" width="170" height="34" rx="9" fill="#1F2A44"/>
      <rect x="14" y="152" width="268" height="30" rx="15" fill="#171B21" stroke="#2A303A"/>
    </g>

    <!-- D: studios -->
    <rect class="t" x="40" y="460" width="500" height="380" rx="20"/>
    <text class="tag" x="72" y="506" fill="#F26B3A">04 · STUDIOS</text>
    <text class="h" x="72" y="548">Reports and decks.</text>
    <text class="p" x="72" y="578">AI-written, edited in place, exported to</text>
    <text class="p" x="72" y="600">Word, PDF and PowerPoint.</text>
    <g transform="translate(72 624)">
      <rect width="170" height="188" rx="8" fill="#F7F6F2"/>
      <rect x="18" y="20" width="96" height="9" rx="3" fill="#1B1F26"/>
      <g fill="#C9CED6"><rect x="18" y="46" width="130" height="5" rx="2"/><rect x="18" y="60" width="122" height="5" rx="2"/><rect x="18" y="74" width="130" height="5" rx="2"/><rect x="18" y="88" width="84" height="5" rx="2"/></g>
      <rect x="18" y="112" width="70" height="7" rx="3" fill="#1B1F26"/>
      <g fill="#C9CED6"><rect x="18" y="132" width="130" height="5" rx="2"/><rect x="18" y="146" width="110" height="5" rx="2"/></g>
    </g>
    <g transform="translate(264 640)">
      <rect width="240" height="136" rx="8" fill="#F7F6F2"/>
      <rect x="18" y="20" width="110" height="11" rx="4" fill="#1B1F26"/><rect x="18" y="40" width="70" height="6" rx="3" fill="#9AA1AC"/>
      <g transform="translate(132 50)"><rect y="30" width="14" height="24" rx="3" fill="#C9CED6"/><rect x="22" y="14" width="14" height="40" rx="3" fill="#C9CED6"/><rect x="44" width="14" height="54" rx="3" fill="#F26B3A"/><rect x="66" y="22" width="14" height="32" rx="3" fill="#C9CED6"/></g>
      <rect x="18" y="112" width="52" height="4" rx="2" fill="url(#gem)"/>
    </g>

    <!-- E: device window -->
    <rect class="t" x="560" y="460" width="380" height="380" rx="20"/>
    <text class="tag" x="592" y="506" fill="#34D399">05 · DEVICES</text>
    <text class="h" x="592" y="548">Phone beside the code.</text>
    <text class="p" x="592" y="578">Android emulator, iOS simulator and</text>
    <text class="p" x="592" y="600">Flutter hot reload in the window.</text>
    <g transform="translate(618 624)">
      <rect width="108" height="190" rx="22" fill="#171B21" stroke="#3A404A" stroke-width="2"/>
      <rect x="6" y="6" width="96" height="178" rx="17" fill="#0B0D10"/>
      <rect x="14" y="28" width="80" height="40" rx="9" fill="#3B82F6"/>
      <g fill="#171B21"><rect x="14" y="78" width="37" height="37" rx="8"/><rect x="57" y="78" width="37" height="37" rx="8"/><rect x="14" y="124" width="80" height="26" rx="8"/></g>
    </g>
    <g transform="translate(750 650)">
      <rect width="162" height="44" rx="12" fill="#171B21" stroke="#2A303A"/>
      <path d="M20 14l12 8-12 8z" fill="#34D399"/><text class="m" x="42" y="27">flutter run</text>
      <rect y="56" width="162" height="44" rx="12" fill="#171B21" stroke="#2A303A"/>
      <path d="M20 70c0 8 5 12 11 12 0-6-4-10-11-12z" fill="#F26B3A"/><text class="m" x="42" y="83">hot reload</text>
      <rect y="112" width="162" height="44" rx="12" fill="#171B21" stroke="#2A303A"/>
      <rect x="18" y="124" width="14" height="20" rx="4" fill="none" stroke="#C9CED6" stroke-width="2"/><text class="m" x="42" y="139">iOS · Android</text>
    </g>

    <!-- F: narration -->
    <rect class="t" x="960" y="460" width="300" height="380" rx="20"/>
    <text class="tag" x="992" y="506" fill="#3B82F6">06 · NARRATION</text>
    <text class="h" x="992" y="548">Read it aloud.</text>
    <text class="p" x="992" y="578">On-device Arabic and</text>
    <text class="p" x="992" y="600">English voices.</text>
    <g transform="translate(992 640)" fill="url(#wave)">
      <rect x="0" y="52" width="8" height="28" rx="4"/><rect x="16" y="38" width="8" height="56" rx="4"/><rect x="32" y="20" width="8" height="92" rx="4"/><rect x="48" y="44" width="8" height="44" rx="4"/><rect x="64" y="8" width="8" height="116" rx="4"/><rect x="80" y="30" width="8" height="72" rx="4"/><rect x="96" y="48" width="8" height="36" rx="4"/><rect x="112" y="14" width="8" height="104" rx="4"/><rect x="128" y="36" width="8" height="60" rx="4"/><rect x="144" y="56" width="8" height="20" rx="4"/><rect x="160" y="26" width="8" height="80" rx="4"/><rect x="176" y="46" width="8" height="40" rx="4"/><rect x="192" y="58" width="8" height="16" rx="4"/><rect x="208" y="40" width="8" height="52" rx="4"/><rect x="224" y="54" width="8" height="24" rx="4"/>
    </g>
    <g transform="translate(992 790)"><rect width="236" height="30" rx="15" fill="#171B21" stroke="#2A303A"/><text class="m" x="16" y="20">SILMA · Lahgtna · Kokoro</text></g>

    <!-- G: run & build -->
    <rect class="t" x="1280" y="460" width="280" height="380" rx="20"/>
    <text class="tag" x="1312" y="506" fill="#F26B3A">07 · RUN</text>
    <text class="h" x="1312" y="548">One-click run.</text>
    <text class="p" x="1312" y="578">15+ ecosystems detected</text>
    <text class="p" x="1312" y="600">from the terminal header.</text>
    <g transform="translate(1312 632)" class="m">
      <rect width="216" height="44" rx="12" fill="#171B21" stroke="#2A303A"/><path d="M18 14l12 8-12 8z" fill="#34D399"/><text class="m" x="42" y="27">Run  main.py</text>
      <rect y="56" width="216" height="44" rx="12" fill="#171B21" stroke="#2A303A"/><path d="M18 70l12 8-12 8z" fill="#34D399"/><text class="m" x="42" y="83">Run  cargo run</text>
      <rect y="112" width="216" height="44" rx="12" fill="#171B21" stroke="#2A303A"/><path d="M18 126l12 8-12 8z" fill="#34D399"/><text class="m" x="42" y="139">Run  npm run dev</text>
      <rect y="168" width="216" height="28" rx="14" fill="none" stroke="#3B82F6" stroke-dasharray="4 4"/><text class="m" x="16" y="187" style="fill:#3B82F6">localhost:5173 ▸ preview</text>
    </g>
  </g>
</svg>
