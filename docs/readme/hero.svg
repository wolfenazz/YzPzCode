<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="t d">
  <title id="t">YzPzCode</title>
  <desc id="d">YzPzCode: the unified workspace for AI coding agents, with a terminal grid, a phone emulator and a slide deck.</desc>
  <defs>
    <pattern id="px" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="12" height="12" rx="2.5" fill="#fff" opacity="0.035"/>
    </pattern>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4285F4"/><stop offset="0.55" stop-color="#9B72CB"/><stop offset="1" stop-color="#D96570"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0D10" stop-opacity="0"/><stop offset="1" stop-color="#0B0D10"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.28"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowO" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F26B3A" stop-opacity="0.18"/><stop offset="1" stop-color="#F26B3A" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="card"><rect width="1600" height="700" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1600" height="700" fill="#0B0D10"/>
    <rect width="1600" height="700" fill="url(#px)"/>
    <ellipse cx="1180" cy="330" rx="520" ry="360" fill="url(#glowB)"/>
    <ellipse cx="260" cy="640" rx="420" ry="220" fill="url(#glowO)"/>

    <!-- mark -->
    <g transform="translate(96 96)">
      <rect width="72" height="72" rx="16" fill="#171B21" stroke="#2A303A"/>
      <path d="M17 22l13 9-13 9" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="35" y="44" width="20" height="5" rx="2.5" fill="#fff"/>
      <rect x="14" y="56" width="10" height="5" rx="2" fill="#3B82F6"/>
      <rect x="31" y="56" width="10" height="5" rx="2" fill="#F26B3A"/>
      <rect x="48" y="56" width="10" height="5" rx="2" fill="#F26B3A"/>
    </g>
    <text x="190" y="127" font-family="'SF Mono','JetBrains Mono',Consolas,Menlo,monospace" font-size="17" letter-spacing="3" fill="#8A929E">UNIFIED WORKSPACE · V5.31</text>

    <!-- title -->
    <text x="92" y="300" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="124" font-weight="800" letter-spacing="-3" fill="#F4F5F7">YzPzCode</text>
    <text x="96" y="366" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#C9CED6">One window for every AI coding agent,</text>
    <text x="96" y="412" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#C9CED6">your tools, your devices and your documents.</text>

    <!-- stat chips -->
    <g font-family="'SF Mono','JetBrains Mono',Consolas,Menlo,monospace" font-size="19">
      <g transform="translate(96 480)">
        <rect width="138" height="56" rx="12" fill="#12151A" stroke="#2A303A"/>
        <text x="20" y="36" fill="#F4F5F7" font-weight="700">26</text><text x="52" y="36" fill="#8A929E">AI CLIs</text>
      </g>
      <g transform="translate(248 480)">
        <rect width="162" height="56" rx="12" fill="#12151A" stroke="#2A303A"/>
        <text x="20" y="36" fill="#F4F5F7" font-weight="700">10</text><text x="52" y="36" fill="#8A929E">tool CLIs</text>
      </g>
      <g transform="translate(424 480)">
        <rect width="136" height="56" rx="12" fill="#12151A" stroke="#2A303A"/>
        <text x="20" y="36" fill="#F4F5F7" font-weight="700">2</text><text x="42" y="36" fill="#8A929E">studios</text>
      </g>
      <g transform="translate(574 480)">
        <rect width="190" height="56" rx="12" fill="#12151A" stroke="#2A303A"/>
        <text x="20" y="36" fill="#F4F5F7" font-weight="700">iOS</text><text x="64" y="36" fill="#8A929E">+ Android</text>
      </g>
    </g>
    <text x="96" y="596" font-family="'SF Mono','JetBrains Mono',Consolas,Menlo,monospace" font-size="17" letter-spacing="2" fill="#6B7380">WINDOWS · MACOS · LINUX  /  TAURI v2 + RUST + REACT 19</text>

    <!-- report page, behind the window -->
    <g transform="translate(1330 60) rotate(5)" filter="url(#sh)">
      <rect width="190" height="250" rx="8" fill="#F7F6F2"/>
      <rect x="22" y="26" width="110" height="10" rx="3" fill="#1B1F26"/>
      <rect x="22" y="48" width="70" height="5" rx="2" fill="#9AA1AC"/>
      <g fill="#C9CED6"><rect x="22" y="78" width="146" height="5" rx="2"/><rect x="22" y="92" width="138" height="5" rx="2"/><rect x="22" y="106" width="146" height="5" rx="2"/><rect x="22" y="120" width="96" height="5" rx="2"/></g>
      <rect x="22" y="146" width="80" height="7" rx="3" fill="#1B1F26"/>
      <g fill="#C9CED6"><rect x="22" y="168" width="146" height="5" rx="2"/><rect x="22" y="182" width="130" height="5" rx="2"/><rect x="22" y="196" width="146" height="5" rx="2"/></g>
      <rect x="22" y="218" width="40" height="3" rx="1.5" fill="url(#gem)"/>
    </g>

    <!-- workspace window -->
    <g transform="translate(790 150)" filter="url(#sh)">
      <rect width="650" height="440" rx="16" fill="#12151A" stroke="#2A303A"/>
      <path d="M0 16a16 16 0 0 1 16-16h618a16 16 0 0 1 16 16v28H0z" fill="#171B21"/>
      <circle cx="26" cy="22" r="6" fill="#3A404A"/><circle cx="46" cy="22" r="6" fill="#3A404A"/><circle cx="66" cy="22" r="6" fill="#3A404A"/>
      <rect x="230" y="12" width="190" height="20" rx="10" fill="#0B0D10"/>
      <rect x="560" y="14" width="64" height="16" rx="8" fill="#0B0D10"/>

      <!-- pane 1: working -->
      <g transform="translate(20 62)">
        <rect width="290" height="170" rx="10" fill="#0B0D10" stroke="url(#gem)" stroke-width="2"/>
        <rect x="0" y="0" width="290" height="30" rx="10" fill="#171B21"/><rect x="0" y="18" width="290" height="12" fill="#171B21"/>
        <circle cx="16" cy="15" r="4.5" fill="#F26B3A"/>
        <text x="30" y="19" font-family="'SF Mono',Consolas,Menlo,monospace" font-size="12" fill="#C9CED6">claude</text>
        <g fill="#2A303A"><rect x="16" y="46" width="150" height="6" rx="3"/><rect x="16" y="62" width="220" height="6" rx="3"/><rect x="16" y="78" width="180" height="6" rx="3"/><rect x="16" y="94" width="120" height="6" rx="3"/></g>
        <rect x="16" y="116" width="96" height="6" rx="3" fill="#3B82F6"/>
        <rect x="16" y="138" width="8" height="14" rx="2" fill="#F4F5F7"/>
      </g>
      <!-- pane 2: done -->
      <g transform="translate(330 62)">
        <rect width="300" height="170" rx="10" fill="#0B0D10" stroke="#34D399" stroke-width="2"/>
        <rect x="0" y="0" width="300" height="30" rx="10" fill="#171B21"/><rect x="0" y="18" width="300" height="12" fill="#171B21"/>
        <circle cx="16" cy="15" r="4.5" fill="#3B82F6"/>
        <text x="30" y="19" font-family="'SF Mono',Consolas,Menlo,monospace" font-size="12" fill="#C9CED6">codex</text>
        <g fill="#2A303A"><rect x="16" y="46" width="190" height="6" rx="3"/><rect x="16" y="62" width="140" height="6" rx="3"/><rect x="16" y="78" width="230" height="6" rx="3"/></g>
        <g transform="translate(16 104)"><rect width="110" height="28" rx="14" fill="#34D399" opacity="0.14"/><path d="M14 14l5 5 9-10" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="19" font-family="'SF Mono',Consolas,Menlo,monospace" font-size="12" fill="#34D399">task done</text></g>
      </g>
      <!-- pane 3: extension -->
      <g transform="translate(20 252)">
        <rect width="290" height="170" rx="10" fill="#0B0D10" stroke="#2A303A"/>
        <rect x="0" y="0" width="290" height="30" rx="10" fill="#171B21"/><rect x="0" y="18" width="290" height="12" fill="#171B21"/>
        <circle cx="16" cy="15" r="4.5" fill="#9B72CB"/>
        <text x="30" y="19" font-family="'SF Mono',Consolas,Menlo,monospace" font-size="12" fill="#C9CED6">Cline · extension</text>
        <rect x="16" y="44" width="180" height="30" rx="8" fill="#171B21"/><rect x="94" y="84" width="180" height="30" rx="8" fill="#1F2A44"/>
        <rect x="16" y="128" width="258" height="26" rx="13" fill="#171B21" stroke="#2A303A"/>
      </g>
      <!-- pane 4: browser -->
      <g transform="translate(330 252)">
        <rect width="300" height="170" rx="10" fill="#0B0D10" stroke="#2A303A"/>
        <rect x="0" y="0" width="300" height="30" rx="10" fill="#171B21"/><rect x="0" y="18" width="300" height="12" fill="#171B21"/>
        <rect x="14" y="8" width="150" height="14" rx="7" fill="#0B0D10"/>
        <rect x="16" y="46" width="268" height="62" rx="8" fill="#171B21"/>
        <rect x="26" y="58" width="90" height="10" rx="4" fill="#3A404A"/>
        <rect x="26" y="76" width="140" height="6" rx="3" fill="#2A303A"/>
        <rect x="60" y="92" width="120" height="48" rx="6" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5 4"/>
        <g transform="translate(150 116)"><rect width="126" height="36" rx="10" fill="#F4F5F7"/><rect x="10" y="12" width="64" height="12" rx="6" fill="#C9CED6"/><rect x="82" y="10" width="34" height="16" rx="8" fill="#0B0D10"/></g>
      </g>
    </g>

    <!-- slide deck card -->
    <g transform="translate(868 508) rotate(-5)" filter="url(#sh)">
      <rect width="270" height="152" rx="10" fill="#F7F6F2"/>
      <rect x="20" y="22" width="120" height="12" rx="4" fill="#1B1F26"/>
      <rect x="20" y="44" width="80" height="6" rx="3" fill="#9AA1AC"/>
      <g transform="translate(150 70)"><rect x="0" y="40" width="16" height="26" rx="3" fill="#C9CED6"/><rect x="24" y="22" width="16" height="44" rx="3" fill="#C9CED6"/><rect x="48" y="6" width="16" height="60" rx="3" fill="#F26B3A"/><rect x="72" y="28" width="16" height="38" rx="3" fill="#C9CED6"/></g>
      <rect x="20" y="124" width="60" height="4" rx="2" fill="url(#gem)"/>
    </g>

    <!-- phone -->
    <g transform="translate(1388 328) rotate(4)" filter="url(#sh)">
      <rect width="158" height="316" rx="30" fill="#171B21" stroke="#3A404A" stroke-width="2"/>
      <rect x="8" y="8" width="142" height="300" rx="24" fill="#0B0D10"/>
      <rect x="58" y="16" width="42" height="10" rx="5" fill="#171B21"/>
      <rect x="18" y="42" width="122" height="58" rx="12" fill="#3B82F6"/>
      <rect x="30" y="56" width="60" height="9" rx="4" fill="#fff" opacity="0.9"/><rect x="30" y="74" width="86" height="6" rx="3" fill="#fff" opacity="0.5"/>
      <g fill="#171B21"><rect x="18" y="114" width="58" height="58" rx="10"/><rect x="82" y="114" width="58" height="58" rx="10"/><rect x="18" y="180" width="122" height="40" rx="10"/><rect x="18" y="228" width="122" height="40" rx="10"/></g>
      <circle cx="48" cy="143" r="12" fill="#F26B3A"/><circle cx="112" cy="143" r="12" fill="#34D399"/>
      <rect x="54" y="292" width="50" height="4" rx="2" fill="#3A404A"/>
    </g>

  </g>
</svg>
